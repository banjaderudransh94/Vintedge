<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vintedge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0A0A0C; --card: #16161A; --line: #27272A; --tx: #ffffff; --mu: #a1a1aa;
      --ac: #ffffff; --ac-tx: #000000; --ease: cubic-bezier(0.32, 0.72, 0, 1);
    }
    * { box-sizing: border-box; margin: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body { background: var(--bg); color: var(--tx); font: 400 15px/1.5 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    button, input, textarea { font: inherit; color: inherit; }
    button { background: none; border: 0; cursor: pointer; }
    button:active { transform: scale(0.97); }
    img { max-width: 100%; }

    .wrap { max-width: 1200px; margin: 0 auto; padding: 3.5rem 1rem; }
    .narrow { max-width: 42rem; }
    h2 { font-size: clamp(1.6rem, 5vw, 2.6rem); font-weight: 900; letter-spacing: -0.03em; margin-bottom: 1.5rem; }
    .btn { display: inline-block; padding: 0.9rem 1.6rem; border-radius: 999px; background: var(--ac); color: var(--ac-tx); font-weight: 800; font-size: 13px; letter-spacing: 0.06em; text-decoration: none; text-align: center; }
    .btn.ghost { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid rgba(255, 255, 255, 0.35); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .btn:disabled { opacity: 0.4; }
    .block { width: 100%; }

    /* ---------- Ticker ---------- */
    .tick { background: #fff; color: #000; overflow: hidden; white-space: nowrap; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; padding: 0.55rem 0; padding-top: calc(0.55rem + env(safe-area-inset-top, 0px)); }
    .tick div { display: inline-flex; animation: scroll 40s linear infinite; }
    .tick span { padding: 0 2rem; }
    @keyframes scroll { to { transform: translateX(-50%); } }

    /* ---------- Nav ---------- */
    .nav { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; padding: 0.6rem 1rem; background: rgba(10, 10, 12, 0.72); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
    .brand { flex: 1; font-size: 20px; font-weight: 900; letter-spacing: -0.03em; color: #fff; text-decoration: none; }
    .bag { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; }
    .bag svg { width: 20px; height: 20px; }
    .bag b { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 10px; background: #fff; color: #000; font-size: 11px; display: grid; place-items: center; }
    .cats { order: 3; width: 100%; display: flex; gap: 0.5rem; overflow-x: auto; scrollbar-width: none; }
    .cats::-webkit-scrollbar { display: none; }
    .cats button { flex: none; padding: 0.5rem 1rem; border-radius: 999px; border: 1px solid var(--line); color: var(--mu); font-size: 13px; font-weight: 600; }
    .cats button.on { background: #fff; color: #000; border-color: #fff; }

    /* ---------- Hero ---------- */
    .hero { min-height: 74vh; display: flex; align-items: flex-end; background: radial-gradient(120% 90% at 70% 10%, #26262d 0%, #0A0A0C 60%) center / cover; }
    .hero .in { width: 100%; max-width: 1200px; margin: 0 auto; padding: 4rem 1rem 3rem; background: linear-gradient(transparent, rgba(10, 10, 12, 0.85)); }
    .hero h1 { font-size: clamp(2.5rem, 11vw, 6rem); line-height: 0.98; letter-spacing: -0.04em; font-weight: 900; max-width: 14ch; }
    .hero p { margin: 1.1rem 0 1.8rem; color: #d4d4d8; font-size: clamp(1rem, 3.5vw, 1.25rem); max-width: 34rem; }
    .hero .btn { margin: 0 0.5rem 0.5rem 0; }

    /* ---------- Grid ---------- */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.7rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
    .im { position: relative; aspect-ratio: 4 / 5; background: #ecebe8; cursor: pointer; overflow: hidden; }
    .im img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 4%; transition: opacity 0.4s, transform 0.6s var(--ease); }
    .im .h { opacity: 0; }
    .pill { position: absolute; top: 8px; left: 8px; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: 0.04em; background: rgba(0, 0, 0, 0.7); color: #fff; }
    .pill.so { background: #fff; color: #000; }
    .info { padding: 0.8rem; display: flex; flex-direction: column; gap: 0.2rem; flex: 1; }
    .info h3 { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
    .price { font-weight: 800; }
    .price s { margin-left: 0.4rem; color: var(--mu); font-weight: 400; font-size: 12px; }
    .sizes { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
    .sizes button { min-width: 38px; height: 34px; padding: 0 0.6rem; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; font-weight: 600; }
    .sizes button:disabled { opacity: 0.3; }
    .sizes button.on { background: #fff; color: #000; border-color: #fff; }
    .empty { grid-column: 1 / -1; color: var(--mu); padding: 2rem 0; }

    /* ---------- Overlays: bottom sheets on phones, centered on desktop ---------- */
    .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s; }
    .scrim.open { opacity: 1; visibility: visible; }
    .sheet { position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 22px 22px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); transform: translateY(100%); visibility: hidden; transition: transform 0.5s var(--ease), visibility 0.5s; }
    .sheet.open { transform: none; visibility: visible; }
    .x { position: absolute; top: 10px; right: 10px; z-index: 3; width: 40px; height: 40px; border-radius: 50%; background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 16px; }

    .pm { display: grid; }
    .car { position: relative; background: #ecebe8; }
    .cs { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .cs::-webkit-scrollbar { display: none; }
    .cs img { flex: 0 0 100%; scroll-snap-align: center; aspect-ratio: 4 / 5; object-fit: contain; padding: 5%; }
    .ar { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; background: rgba(0, 0, 0, 0.6); color: #fff; }
    .ar.l { left: 8px; } .ar.r { right: 8px; }
    .pi { padding: 1.4rem 1.2rem 1.6rem; }
    .pi small { color: var(--mu); }
    .pi h3 { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.03em; line-height: 1.1; margin: 0.2rem 0 0.6rem; }
    .pi .price { font-size: 1.3rem; }
    .badges { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.9rem 0; }
    .badges span { padding: 0.25rem 0.7rem; border-radius: 999px; border: 1px solid var(--line); font-size: 11px; font-weight: 700; }
    .badges span.ok { background: #fff; color: #000; border-color: #fff; }
    .desc { color: var(--mu); white-space: pre-line; margin-bottom: 1rem; }
    .lbl { font-size: 12px; color: var(--mu); margin: 1rem 0 0.4rem; }

    .drawer { position: fixed; z-index: 50; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: rgba(10, 10, 12, 0.96); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-left: 1px solid var(--line); display: flex; flex-direction: column; transform: translateX(100%); visibility: hidden; transition: transform 0.5s var(--ease), visibility 0.5s; }
    .drawer.open { transform: none; visibility: visible; }
    .dh { display: flex; justify-content: space-between; align-items: center; padding: calc(1rem + env(safe-area-inset-top, 0px)) 1.2rem 1rem; border-bottom: 1px solid var(--line); font-size: 20px; font-weight: 900; }
    .dh button { width: 40px; height: 40px; border-radius: 50%; }
    .lines { flex: 1; overflow-y: auto; padding: 0 1.2rem; }
    .line { display: flex; gap: 0.8rem; padding: 1rem 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .line img { width: 68px; height: 84px; object-fit: contain; border-radius: 10px; background: #ecebe8; flex: none; }
    .line .d { flex: 1; }
    .line .muted { color: var(--mu); }
    .qty { display: inline-flex; align-items: center; gap: 0.2rem; margin-top: 0.4rem; border: 1px solid var(--line); border-radius: 999px; }
    .qty button { width: 36px; height: 36px; font-size: 18px; }
    .qty span { min-width: 22px; text-align: center; }
    .rm { align-self: flex-start; width: 36px; height: 36px; color: var(--mu); }
    .sum { padding: 1rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
    .sum div { display: flex; justify-content: space-between; color: var(--mu); font-size: 14px; margin-bottom: 0.2rem; }
    .sum .t { color: #fff; font-weight: 800; font-size: 18px; margin: 0.6rem 0 0.9rem; }

    .co { padding: 1.4rem 1.2rem 1.6rem; }
    .co h3 { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
    .co label { display: block; margin-top: 0.9rem; font-size: 12px; color: var(--mu); }
    .co input[type=text], .co input[type=tel], .co textarea { width: 100%; margin-top: 0.3rem; padding: 0.85rem 1rem; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 16px; outline: none; }
    .co input:focus, .co textarea:focus { border-color: #fff; }
    .pay { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-top: 0.4rem; }
    .pay label { margin: 0; }
    .pay input { display: none; }
    .pay span { display: block; text-align: center; padding: 0.75rem 0.3rem; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; font-weight: 700; color: #fff; cursor: pointer; }
    .pay input:checked + span { background: #fff; color: #000; border-color: #fff; }
    .qr { text-align: center; color: var(--mu); font-size: 13px; margin-top: 0.9rem; }
    .qr img { width: 180px; border-radius: 12px; background: #fff; padding: 8px; margin-bottom: 0.5rem; }
    .co .t { display: flex; justify-content: space-between; font-weight: 800; font-size: 18px; margin: 1.2rem 0 0.9rem; }

    footer { border-top: 1px solid var(--line); padding: 2rem 1rem calc(2rem + env(safe-area-inset-bottom, 0px)); text-align: center; color: var(--mu); font-size: 13px; }
    footer a { color: #fff; margin: 0 0.7rem; }
    .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 90; max-width: 90vw; padding: 0.75rem 1.3rem; border-radius: 999px; background: #fff; color: #000; font-size: 13px; font-weight: 700; text-align: center; transform: translate(-50%, 120px); transition: transform 0.5s var(--ease); }
    .toast.on { transform: translate(-50%, 0); }

    /* ---------- Larger screens ---------- */
    @media (min-width: 720px) {
      .wrap { padding: 5rem 2rem; }
      .nav { flex-wrap: nowrap; padding: 0.7rem 2rem; }
      .cats { order: 0; width: auto; flex: 1; }
      .grid { grid-template-columns: repeat(3, 1fr); gap: 1.2rem; }
      .info { padding: 1rem; } .info h3 { font-size: 16px; }
      .hero .in { padding: 5rem 2rem 4rem; }
      .sheet.pm-sheet, .sheet.co-sheet { left: 50%; right: auto; top: 50%; bottom: auto; border-radius: 24px; transform: translate(-50%, -46%) scale(0.97); opacity: 0; }
      .sheet.pm-sheet.open, .sheet.co-sheet.open { transform: translate(-50%, -50%); opacity: 1; }
      .sheet.pm-sheet { width: min(960px, 94vw); max-height: 90vh; }
      .sheet.co-sheet { width: min(480px, 94vw); max-height: 90vh; }
      .pm { grid-template-columns: 1fr 1fr; }
      .pi { padding: 2.2rem; }
    }
    @media (min-width: 1000px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    @media (hover: hover) { .card:hover .im .h { opacity: 1; } .card:hover .im img { transform: scale(1.04); } }
    @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation: none !important; } }
  </style>
</head>

  <div class="tick"><div id="tk"></div></div>

  <header class="nav">
    <a class="brand" id="brand" href="#"></a>
    <button class="bag" id="bagBtn" aria-label="Open bag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      <b id="bagN">0</b>
    </button>
    <nav class="cats" id="cats"></nav>
  </header>

  <section class="hero" id="hero"><div class="in">
    <h1 id="hT"></h1><p id="hS"></p>
    <a class="btn" id="hA" href="#shop"></a><a class="btn ghost" id="hB" href="#story"></a>
  </div></section>

  <section class="wrap" id="shop"><h2 id="shopT"></h2><div class="grid" id="grid"></div></section>
  <section class="wrap narrow" id="story"><h2 id="storyT"></h2><p class="desc" id="storyP"></p></section>
  <footer id="foot"></footer>

  <div class="scrim" id="scrim"></div>
  <div class="sheet pm-sheet" id="pm"></div>

  <aside class="drawer" id="drawer">
    <div class="dh"><span id="bagT"></span><button id="bagClose" aria-label="Close bag">&#10005;</button></div>
    <div class="lines" id="lines"></div>
    <div class="sum" id="sum"></div>
  </aside>

  <div class="sheet co-sheet" id="co">
    <form class="co" id="coForm">
      <button type="button" class="x" data-close aria-label="Close">&#10005;</button>
      <h3 id="coT"></h3>
      <label>Full name<input type="text" name="name" required autocomplete="name"></label>
      <label>Phone number<input type="tel" name="phone" required pattern="[0-9]{10}" inputmode="numeric" placeholder="98XXXXXXXX" autocomplete="tel"></label>
      <label>Delivery address<textarea name="address" rows="2" required autocomplete="street-address"></textarea></label>
      <label>Payment</label>
      <div class="pay" id="payBox"></div>
      <div class="qr" id="qr"></div>
      <div class="t"><span>Total</span><span id="coTotal"></span></div>
      <button class="btn block" id="placeBtn"></button>
    </form>
  </div>

  <div class="toast" id="toast"></div>

    // ------------------------------------------------------------------
    // Helpers
    // ------------------------------------------------------------------
    const $ = s => document.querySelector(s);
    const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const read = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
    const write = (k, v) => localStorage.setItem(k, JSON.stringify(v));

    let cfg = DEFAULTS, products = [], bag = read(KEY.cart, []), category = "All", modalSize = "";
    const money = n => `${cfg.currency} ${Number(n).toLocaleString("en-IN")}`;
    const unit = p => p.discount_price || p.price;
    const find = id => products.find(p => String(p.id) === String(id));
    const pic = (p, n = 0) => (p.images && p.images[n]) || (p.images && p.images[0]) || "";

    function toast(message) {
      const el = $("#toast");
      el.textContent = message;
      el.classList.add("on");
      clearTimeout(toast.t);
      toast.t = setTimeout(() => el.classList.remove("on"), 2400);
    }

    // ------------------------------------------------------------------
    // Data layer. products: { id, sort, title, category, price, discount_price,
    //   delivery_charge, sizes[], description, images[], in_stock }
    // ------------------------------------------------------------------
    if (!db && !read(KEY.products, null)) write(KEY.products, DEMO_PRODUCTS);

    async function getSettings() {
      if (db) {
        const { data } = await db.from("site_config").select("settings").eq("id", 1).maybeSingle();
        return { ...DEFAULTS, ...((data && data.settings) || {}) };
      }
      return { ...DEFAULTS, ...read(KEY.settings, {}) };
    }

    async function getProducts() {
      if (db) {
        const { data } = await db.from("products").select("*").order("sort", { ascending: true });
        return data || [];
      }
      return read(KEY.products, []);
    }

    async function insertOrder(order) {
      if (db) {
        const { error } = await db.from("orders").insert(order);
        if (error) throw error;
        return;
      }
      const list = read(KEY.orders, []);
      list.unshift({ ...order, id: Date.now(), created_at: new Date().toISOString() });
      write(KEY.orders, list);
    }

    // ------------------------------------------------------------------
    // Bag maths: delivery = highest charge in the bag (a piece's own charge, else the
    // default), free once the subtotal reaches the free-delivery minimum.
    // ------------------------------------------------------------------
    function totals() {
      const lines = bag.map(b => ({ ...b, p: find(b.id) })).filter(l => l.p);
      const sub = lines.reduce((s, l) => s + unit(l.p) * l.qty, 0);
      const n = lines.reduce((s, l) => s + l.qty, 0);
      const fee = p => (p.delivery_charge ?? Number(cfg.delivery_default));
      const delivery = !lines.length || sub >= Number(cfg.free_delivery_min) ? 0 : Math.max(...lines.map(l => fee(l.p)));
      return { lines, sub, n, delivery, total: sub + delivery };
    }

    // ------------------------------------------------------------------
    // Rendering
    // ------------------------------------------------------------------
    function renderText() {
      document.title = cfg.brand_name;
      $("#brand").textContent = cfg.brand_name;
      const phrases = String(cfg.announcement).split("|").map(s => s.trim()).filter(Boolean);
      const strip = phrases.map(p => `<span>${esc(p)}</span><span>&bull;</span>`).join("");
      $("#tk").innerHTML = strip.repeat(Math.max(4, Math.ceil(16 / Math.max(phrases.length, 1))) * 2);
      $("#hT").textContent = cfg.hero_title;
      $("#hS").textContent = cfg.hero_sub;
      $("#hA").textContent = cfg.hero_cta_primary;
      $("#hB").textContent = cfg.hero_cta_secondary;
      $("#hero").style.backgroundImage = cfg.hero_image ? `url(${JSON.stringify(cfg.hero_image)})` : "";
      $("#shopT").textContent = cfg.shop_title;
      $("#storyT").textContent = cfg.story_title;
      $("#storyP").textContent = cfg.story_text;
      $("#bagT").textContent = cfg.bag_title;
      $("#coT").textContent = cfg.checkout_title;
      $("#placeBtn").textContent = cfg.place_order_label;

      const hex = cfg.accent_color || "#ffffff";
      const lum = (parseInt(hex.slice(1, 3), 16) * 299 + parseInt(hex.slice(3, 5), 16) * 587 + parseInt(hex.slice(5, 7), 16) * 114) / 1000;
      document.documentElement.style.setProperty("--ac", hex);
      document.documentElement.style.setProperty("--ac-tx", lum > 140 ? "#000000" : "#ffffff");

      const links = [
        cfg.instagram_url && `<a href="${esc(cfg.instagram_url)}" target="_blank" rel="noopener">Instagram</a>`,
        cfg.tiktok_url && `<a href="${esc(cfg.tiktok_url)}" target="_blank" rel="noopener">TikTok</a>`
      ].filter(Boolean).join("");
      $("#foot").innerHTML = `${links ? `<div style="margin-bottom:.6rem">${links}</div>` : ""}${esc(cfg.footer_text || `\u00A9 ${new Date().getFullYear()} ${cfg.brand_name}`)}`;

      const methods = [["Cash on Delivery", cfg.cod_label], ["eSewa", "eSewa"], ["Fonepay", "Fonepay"]];
      $("#payBox").innerHTML = methods.map(([value, label], i) =>
        `<label><input type="radio" name="pay" value="${value}" ${i === 0 ? "checked" : ""}><span>${esc(label)}</span></label>`).join("");
      renderPay();
    }

    function renderCats() {
      const cats = ["All", ...new Set(products.map(p => p.category).filter(Boolean))];
      if (!cats.includes(category)) category = "All";
      $("#cats").innerHTML = cats.map(c => `<button data-cat="${esc(c)}" class="${c === category ? "on" : ""}">${esc(c)}</button>`).join("");
    }

    function renderGrid() {
      const list = products.filter(p => category === "All" || p.category === category);
      if (!list.length) { $("#grid").innerHTML = `<p class="empty">Nothing here yet. New pieces drop soon.</p>`; return; }
      $("#grid").innerHTML = list.map(p => `
        <article class="card">
          <div class="im" data-open="${p.id}">
            <img src="${esc(pic(p))}" alt="${esc(p.title)}" loading="lazy">
            ${p.images && p.images[1] ? `<img class="h" src="${esc(p.images[1])}" alt="" loading="lazy">` : ""}
            <span class="pill ${p.in_stock ? "" : "so"}">${esc(p.in_stock ? cfg.in_stock_label : cfg.sold_out_label)}</span>
          </div>
          <div class="info">
            <h3>${esc(p.title)}</h3>
            <div class="price">${money(unit(p))}${p.discount_price ? `<s>${money(p.price)}</s>` : ""}</div>
            <div class="sizes">${(p.sizes || []).map(s => `<button data-quick="${p.id}" data-size="${esc(s)}" ${p.in_stock ? "" : "disabled"}>${esc(s)}</button>`).join("")}</div>
          </div>
        </article>`).join("");
    }

    function renderBag() {
      write(KEY.cart, bag);
      const t = totals();
      $("#bagN").textContent = t.n;
      $("#lines").innerHTML = t.lines.length ? t.lines.map(l => {
        const i = bag.findIndex(b => b.id === l.id && b.size === l.size);
        return `<div class="line"><img src="${esc(pic(l.p))}" alt="">
          <div class="d"><b>${esc(l.p.title)}</b><div class="muted">${l.size ? "Size " + esc(l.size) + " &middot; " : ""}${money(unit(l.p))}</div>
          <div class="qty"><button data-q="${i}" data-d="-1" aria-label="Less">&minus;</button><span>${l.qty}</span><button data-q="${i}" data-d="1" aria-label="More">+</button></div></div>
          <button class="rm" data-rm="${i}" aria-label="Remove">&#10005;</button></div>`;
      }).join("") : `<p style="color:var(--mu);padding:3rem 0;text-align:center">${esc(cfg.bag_empty)}</p>`;
      $("#sum").innerHTML = `
        <div><span>Subtotal (${t.n})</span><span>${money(t.sub)}</span></div>
        <div><span>Delivery</span><span>${t.delivery ? money(t.delivery) : "Free"}</span></div>
        <div class="t"><span>Total</span><span>${money(t.total)}</span></div>
        <button class="btn block" id="goCheckout" ${t.n ? "" : "disabled"}>${esc(cfg.checkout_label)}</button>`;
    }

    function renderPay() {
      const form = $("#coForm");
      const method = form.pay ? form.pay.value : "Cash on Delivery";
      $("#qr").innerHTML = method === "Cash on Delivery" ? ""
        : `${cfg.qr_url ? `<img src="${esc(cfg.qr_url)}" alt="${esc(method)} QR">` : ""}<div>${esc(cfg.pay_note)}</div>`;
    }

    function openProduct(id) {
      const p = find(id);
      if (!p) return;
      modalSize = "";
      const fee = p.delivery_charge ?? cfg.delivery_default;
      const imgs = (p.images && p.images.length ? p.images : [""]);
      $("#pm").innerHTML = `
        <button class="x" data-close aria-label="Close">&#10005;</button>
        <div class="pm">
          <div class="car"><div class="cs" id="cs">${imgs.map(u => `<img src="${esc(u)}" alt="">`).join("")}</div>
            ${imgs.length > 1 ? `<button class="ar l" data-slide="-1" aria-label="Previous">&lsaquo;</button><button class="ar r" data-slide="1" aria-label="Next">&rsaquo;</button>` : ""}</div>
          <div class="pi">
            <small>${esc(p.category)}</small><h3>${esc(p.title)}</h3>
            <div class="price">${money(unit(p))}${p.discount_price ? `<s>${money(p.price)}</s>` : ""}</div>
            <div class="badges"><span class="${p.in_stock ? "ok" : ""}">${esc(p.in_stock ? cfg.in_stock_label : cfg.sold_out_label)}</span>
              <span>Delivery ${money(fee)}</span><span>Free over ${money(cfg.free_delivery_min)}</span></div>
            <p class="desc">${esc(p.description)}</p>
            ${(p.sizes || []).length ? `<div class="lbl">${esc(cfg.select_size_label)}</div><div class="sizes" id="msizes">${p.sizes.map(s => `<button data-msize="${esc(s)}">${esc(s)}</button>`).join("")}</div>` : ""}
            <button class="btn block" style="margin-top:1.3rem" data-madd="${p.id}" ${p.in_stock ? "" : "disabled"}>${esc(p.in_stock ? cfg.add_label : cfg.sold_out_label.toUpperCase())}</button>
          </div>
        </div>`;
      openLayer("#pm");
    }

    // ------------------------------------------------------------------
    // Layers (sheet, drawer, scrim)
    // ------------------------------------------------------------------
    function openLayer(selector) {
      closeAll();
      $(selector).classList.add("open");
      $("#scrim").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeAll() {
      document.querySelectorAll(".sheet.open, .drawer.open, .scrim.open").forEach(el => el.classList.remove("open"));
      document.body.style.overflow = "";
    }

    function addToBag(id, size) {
      const p = find(id);
      if (!p || !p.in_stock) return;
      if ((p.sizes || []).length && !size) return toast("Select a size first");
      const hit = bag.find(b => String(b.id) === String(id) && b.size === (size || ""));
      if (hit) hit.qty++; else bag.push({ id: String(id), size: size || "", qty: 1 });
      renderBag();
      return true;
    }

    // ------------------------------------------------------------------
    // Events
    // ------------------------------------------------------------------
    document.addEventListener("click", e => {
      const t = e.target.closest("button, [data-open], .scrim");
      if (!t) return;
      if (t.dataset.close !== undefined || t.id === "bagClose" || t.classList.contains("scrim")) return closeAll();
      if (t.dataset.cat !== undefined) { category = t.dataset.cat; renderCats(); return renderGrid(); }
      if (t.dataset.open) return openProduct(t.dataset.open);
      if (t.dataset.quick) { if (addToBag(t.dataset.quick, t.dataset.size)) toast("Added to bag"); return; }
      if (t.dataset.msize) { modalSize = t.dataset.msize; document.querySelectorAll("#msizes button").forEach(b => b.classList.toggle("on", b === t)); return; }
      if (t.dataset.madd) { if (addToBag(t.dataset.madd, modalSize)) { openLayer("#drawer"); } return; }
      if (t.dataset.slide) { const c = $("#cs"); return c.scrollBy({ left: c.clientWidth * t.dataset.slide, behavior: "smooth" }); }
      if (t.id === "bagBtn") { renderBag(); return openLayer("#drawer"); }
      if (t.dataset.q !== undefined) { const i = +t.dataset.q; bag[i].qty += +t.dataset.d; if (bag[i].qty < 1) bag.splice(i, 1); return renderBag(); }
      if (t.dataset.rm !== undefined) { bag.splice(+t.dataset.rm, 1); return renderBag(); }
      if (t.id === "goCheckout") { $("#coTotal").textContent = money(totals().total); openLayer("#co"); renderPay(); }
    });

    document.addEventListener("keydown", e => { if (e.key === "Escape") closeAll(); });
    $("#coForm").addEventListener("change", renderPay);

    $("#coForm").addEventListener("submit", async e => {
      e.preventDefault();
      const f = e.target, t = totals();
      if (!t.n) return;
      $("#placeBtn").disabled = true;
      try {
        await insertOrder({
          customer_name: f.name.value.trim(), phone: f.phone.value, address: f.address.value.trim(), payment: f.pay.value,
          items: t.lines.map(l => ({ id: l.id, title: l.p.title, size: l.size, qty: l.qty, price: unit(l.p) })),
          subtotal: t.sub, delivery_fee: t.delivery, total: t.total, status: "Pending"
        });
        bag = []; renderBag(); f.reset(); renderPay(); closeAll(); toast(cfg.success_message);
      } catch (err) { toast("Order failed: " + err.message); }
      $("#placeBtn").disabled = false;
    });

    // ------------------------------------------------------------------
    // Boot
    // ------------------------------------------------------------------
    async function init() {
      [cfg, products] = await Promise.all([getSettings(), getProducts()]);
      renderText(); renderCats(); renderGrid(); renderBag();
    }
    init();
    window.addEventListener("storage", init);   // demo mode: admin edits show up live
    if (db) {
      db.channel("live")
        .on("postgres_changes", { event: "*", schema: "public", table: "site_config" }, init)
        .on("postgres_changes", { event: "*", schema: "public", table: "products" }, init)
        .subscribe();
    }
  </script>
</body>
</html>
